# Keep @polarizetech/polarize-ui on the newest release.
#
# Hourly (and on demand) this looks for a newer vX.Y.Z tag on
# github.com/polarizetech/polarize-ui. If there is one it updates package.json and
# yarn.lock, runs the full build (type check + Vite), and only if that passes commits
# to master and starts the Pages deploy. A failed build pushes nothing and fails the
# run, so GitHub emails you.
name: polarize-ui

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [polarize-ui-release]

permissions:
  contents: write
  actions: write

concurrency:
  group: polarize-ui-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the newest release
        id: v
        run: |
          latest=$(git ls-remote --tags --refs https://github.com/polarizetech/polarize-ui.git 'v*' \
                   | awk -F/ '{print $3}' | sort -V | tail -1)
          current=$(node -p "(require('./package.json').dependencies['@polarizetech/polarize-ui']||'').split('#')[1]||'none'")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "polarize-ui: pinned $current, newest $latest" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        if: steps.v.outputs.latest != steps.v.outputs.current
        with:
          node-version: 22
          cache: yarn

      - name: Update and build
        if: steps.v.outputs.latest != steps.v.outputs.current
        run: |
          yarn install --frozen-lockfile
          yarn add "github:polarizetech/polarize-ui#${{ steps.v.outputs.latest }}"
          yarn build

      - name: Commit, push and deploy
        if: steps.v.outputs.latest != steps.v.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock
          git commit -m "polarize-ui ${{ steps.v.outputs.current }} → ${{ steps.v.outputs.latest }}"
          for i in 1 2 3; do git pull -q --rebase origin master && git push origin HEAD:master && break; sleep 5; [ $i = 3 ] && exit 1; done
          # A push made with the Actions token does not trigger other workflows, so start the deploy.
          gh workflow run pages.yml --ref master
