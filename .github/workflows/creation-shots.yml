# Step screenshots for a creation (CREATIONS.md §3), taken here instead of on a laptop.
# Run it with tools/shots, which pushes the creation's working state to a scratch branch,
# dispatches this workflow, downloads the images into creations/<slug>/steps/ and cleans up.
name: Creation screenshots
run-name: shots ${{ inputs.slug }} step ${{ inputs.step }} (${{ inputs.ref }})

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch holding the state to screenshot (usually shots/<slug>-<NN>)
        required: true
      slug:
        description: Creation slug
        required: true
      step:
        description: Two-digit step number
        required: true
      anchor:
        description: Optional local anchor to screenshot, e.g. #section
        required: false
        default: ''
      full_page:
        description: Capture the full page
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-24.04
    env:
      SLUG: ${{ inputs.slug }}
      STEP: ${{ inputs.step }}
      ANCHOR: ${{ inputs.anchor }}
      FULL_PAGE: ${{ inputs.full_page && '--full-page' || '' }}
      PLAYWRIGHT: playwright@1.55.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: creations/${{ inputs.slug }}

      - name: Check inputs
        run: |
          [[ "$SLUG" =~ ^[a-z0-9-]+$ ]] || { echo "bad slug: $SLUG"; exit 1; }
          [[ "$STEP" =~ ^[0-9]{2}$ ]] || { echo "step must be two digits: $STEP"; exit 1; }
          [[ -z "$ANCHOR" || "$ANCHOR" =~ ^#[A-Za-z0-9_-]+$ ]] || { echo "bad anchor: $ANCHOR"; exit 1; }
          test -f "creations/$SLUG/index.html"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium, WebKit, cwebp and Inter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp fonts-inter
          npx -y "$PLAYWRIGHT" install --with-deps chromium webkit

      - name: Screenshot desktop and mobile (light scheme)
        run: |
          mkdir -p out
          url="file://$PWD/creations/$SLUG/index.html$ANCHOR"
          npx -y "$PLAYWRIGHT" screenshot --browser=chromium --viewport-size=1440,900 --color-scheme=light \
            --wait-for-timeout=600 $FULL_PAGE "$url" "out/$STEP.png"
          # The iPhone preset runs in WebKit, like a real iPhone.
          npx -y "$PLAYWRIGHT" screenshot --device="iPhone 13" --color-scheme=light \
            --wait-for-timeout=600 $FULL_PAGE "$url" "out/$STEP-m.png"
          for f in out/*.png; do cwebp -quiet -q 82 "$f" -o "${f%.png}.webp" && rm "$f"; done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: shots-${{ inputs.slug }}-${{ inputs.step }}
          path: out/
          retention-days: 7
